site_name: Tasktree
site_description: Tasks and multi-repository workspaces in one git-backed tool
site_url: https://tinmancoding.github.io/tasktree
repo_url: https://github.com/tinmancoding/tasktree
repo_name: tinmancoding/tasktree

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Importing V1 workspaces: getting-started/importing-v1.md
  - Concepts:
